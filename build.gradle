plugins {
    id 'java'
    id 'application'
}

group = 'org.citydb'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    maven { url 'https://repo.osgeo.org/repository/release/' }
    mavenCentral()
}

def geotoolsVersion = '34.1'

dependencies {
    // GeoTools
    implementation "org.geotools:gt-coverage:${geotoolsVersion}"
    implementation "org.geotools:gt-geotiff:${geotoolsVersion}"
    implementation "org.geotools:gt-referencing:${geotoolsVersion}"
    implementation "org.geotools:gt-main:${geotoolsVersion}"
    implementation "org.geotools:gt-epsg-hsql:${geotoolsVersion}"

    // CLI
    implementation 'commons-cli:commons-cli:1.9.0'

    // JSON
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.47'

    // Database
    implementation 'org.postgresql:postgresql:42.7.5'
    implementation 'org.apache.tomcat:tomcat-jdbc:11.0.14'

    // Test
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.citydb.terrain.Launcher'

    // Keep generated start scripts short: rely on the JAR's Class-Path manifest
    // entry to resolve dependencies instead of listing every lib/*.jar on the
    // command line. This avoids the Windows command-line length limit.
    startScripts {
        classpath = jar.outputs.files
    }
}

jar {
    manifest {
        attributes(
            'Main-Class': application.mainClass,
            'Class-Path': configurations.runtimeClasspath.collect { it.name }.join(' ')
        )
    }
}

test {
    useJUnitPlatform()
}
